<script type="ee7c73c95867e4a493f66ec2-text/javascript">
document.getElementById('kesimpulan').addEventListener('change', function() {
  var catatanDiv = document.getElementById('catatan_div');
  if (this.value === 'L') {
    catatanDiv.style.display = 'block';
  } else {
    catatanDiv.style.display = 'none';
  }
});


document.getElementById('kehadiran').addEventListener('change', function() {
  var detailDiv = document.getElementById('detail_kehadiran');
  if (this.value === 'Tidak Lengkap') {
    detailDiv.style.display = 'block';
  } else {
    detailDiv.style.display = 'none';
  }
});

</script>

<script type="ee7c73c95867e4a493f66ec2-text/javascript">
  const textarea = document.getElementById("catatan");
  const counter = document.getElementById("char_count");
  const maxChars = 100;

  textarea.addEventListener("input", function() {
    const remaining = maxChars - this.value.length;
    counter.textContent = "Sisa " + remaining + " karakter";
  });
</script>
