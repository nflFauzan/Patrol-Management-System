<script type="6704af343f2f3193b46eb4a4-text/javascript">
let cameraActive=false,cameraInitializing=false,locationDetected=false,locationInitializing=false,idleTimer;
function resetIdleTimer(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{window.location.href="index.php"},60000)}
function updateNotificationGlobal(){
    let notif=document.getElementById('notification'),locText,locColor;
    if(locationDetected){locText='Terdeteksi ✅';locColor='green'}else if(locationInitializing){locText='Mencari lokasi...';locColor='#ff9900'}else{locText='Belum aktif ❌';locColor='red'}
    let camText,camColor;
    if(cameraInitializing){camText='Mencari kamera...';camColor='#ff9900'}else{camText=cameraActive?'Aktif ✅':'Belum aktif ❌';camColor=cameraActive?'green':'red'}
    let additionalText='';
    if(locationDetected)additionalText=`<div style="color:#0066cc;font-weight:bold;margin-top:25px;font-size:16px;">Silahkan klik Foto dan Simpan..!</div>`;
    notif.innerHTML=`Lokasi: <span style="color:${locColor};font-weight:bold;">${locText}</span> | Kamera: <span style="color:${camColor};font-weight:bold;">${camText}</span>${additionalText}`;
}
function startCamera(){
    cameraActive=false;cameraInitializing=true;updateNotificationGlobal();
    try{
        Webcam.reset();Webcam.set({width:320,height:320,dest_width:320,dest_height:320,image_format:'jpeg',jpeg_quality:20,flip_horiz:false,fps:15});Webcam.attach('#camera');
        Webcam.on('live',function(){cameraActive=true;cameraInitializing=false;updateNotificationGlobal()});
        Webcam.on('error',function(err){cameraActive=false;cameraInitializing=false;console.error('WebcamJS error:',err);updateNotificationGlobal()});
    }catch(e){cameraActive=false;cameraInitializing=false;console.error(e);updateNotificationGlobal()}
}
function getLocationout(){
    if(navigator.geolocation){
        locationDetected=false;locationInitializing=true;updateNotificationGlobal();
        navigator.geolocation.getCurrentPosition(
            function(position){
                document.getElementById('latout').value=position.coords.latitude;
                document.getElementById('longout').value=position.coords.longitude;
                locationDetected=true;locationInitializing=false;updateNotificationGlobal();startCamera();
            },
            function(error){
                locationDetected=false;locationInitializing=false;updateNotificationGlobal();
                if(error.code===error.PERMISSION_DENIED)alert('Aktifkan izin lokasi lalu klik refresh..');
                else if(error.code===error.TIMEOUT)alert('GPS lambat. Coba refresh atau pindah area terbuka.');
                else alert('Gagal mendapatkan lokasi.');
            },
            {enableHighAccuracy:true,timeout:8000,maximumAge:5000}
        );
    }else{
        locationDetected=false;locationInitializing=false;alert('Browser tidak mendukung geolokasi.');updateNotificationGlobal();
    }
}
function preview(){
    if(!locationDetected){alert("Tunggu lokasi selesai terdeteksi!");return}
    if(!cameraActive){alert("Aktifkan izin kamera lalu klik refresh untuk mencoba lagi.");return}
    Webcam.snap(function(data_uri){$(".image-tag").val(data_uri);document.getElementById('camera').innerHTML='<img src="'+data_uri+'">'});
    document.getElementById('webcam').style.display='none';document.getElementById('simpan').style.display='';resetIdleTimer();
}
function batal(){
    document.getElementById('camera').innerHTML='';document.getElementById('webcam').style.display='flex';document.getElementById('simpan').style.display='none';
    cameraActive=false;cameraInitializing=false;updateNotificationGlobal();startCamera();resetIdleTimer();
}
function refreshAll(){
    document.getElementById('latout').value='';document.getElementById('longout').value='';
    cameraActive=false;cameraInitializing=false;locationDetected=false;locationInitializing=false;updateNotificationGlobal();
    try{Webcam.reset()}catch(e){}
    setTimeout(getLocationout,500);resetIdleTimer();
}
function isIOS(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)}
document.addEventListener("DOMContentLoaded",function(){
    resetIdleTimer();
    if(isIOS()){
        document.getElementById('notification').innerHTML=`<div style="color:#cc0000;font-weight:bold;font-size:16px;margin-top:20px;">Akses kamera dan lokasi dibatasi oleh kebijakan keamanan iOS.<br>Gunakan perangkat Android.!</div>`;
        return;
    }
    getLocationout();
    const form=document.getElementById('myForm');
    if(form){
        const btn=document.getElementById('submitBtn');
        form.addEventListener('submit',function(e){
            if(!document.getElementById('latout').value||!document.getElementById('longout').value){
                alert("Lokasi tidak valid! Pastikan izin lokasi aktif.");e.preventDefault();return;
            }
            if(btn.disabled){e.preventDefault();return}
            btn.disabled=true;btn.innerText='Menyimpan...';clearTimeout(idleTimer);
        });
    }
});
</script>
