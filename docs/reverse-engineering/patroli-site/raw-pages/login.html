<script type="e562e2b9bd41da7a7484da5c-text/javascript">
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", async ()=>{
    installBtn.style.display = "none";
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
});
</script>

<script type="e562e2b9bd41da7a7484da5c-text/javascript">
$(document).ready(function(){

  // ======================
  // COMPANY CHECKER
  // ======================
  $('#nama_perusahaan').on('input', function(){
    let val = $(this).val().trim();

    if(val !== ''){
      $.post('checker.php', {perusahaan_name: val}, function(res){
        $('#perusahaan_result').html(res);
      });
    } else {
      $('#perusahaan_result').html('');
    }
  });


  // ======================
  // USERNAME CHECKER
  // ======================
  $('#username').on('input', function(){
    let val = $(this).val().trim();

    if(val !== ''){
      $.post('checker.php', {u_name: val}, function(res){
        $('#uname_result').html(res);
      });
    } else {
      $('#uname_result').html('');
    }
  });


  // ======================
  // PASSWORD STRENGTH (BUKAN DATABASE)
  // ======================
  $('#password').on('input', function(){
    let pass = $(this).val();

    let msg = '';

    if(pass.length < 6){
      msg = "<span style='color:red'>Password lemah</span>";
    } else if(pass.length < 10){
      msg = "<span style='color:orange'>Password sedang</span>";
    } else {
      msg = "<span style='color:green'>Password kuat</span>";
    }

    $('#pass_result').html(msg);
  });

});
</script>
