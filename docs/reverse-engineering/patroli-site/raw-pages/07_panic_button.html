<script type="4cc10546145508de2e254857-text/javascript">
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector("form");
  const sosButton = document.getElementById("sosButton");
  const latInput = document.getElementById("lat");
  const longInput = document.getElementById("long");

  sosButton.addEventListener("click", function () {
    sosButton.disabled = true;
    sosButton.innerText = "Mengambil Lokasi...";

    if (!navigator.geolocation) {
      alert("Browser tidak mendukung geolokasi.");
      sosButton.disabled = false;
      sosButton.innerText = "SOS";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (position) {
        latInput.value = position.coords.latitude;
        longInput.value = position.coords.longitude;

        form.submit(); // submit setelah lokasi tersedia
      },
      function (error) {
        alert("Gagal mengambil lokasi. Pastikan izin lokasi aktif.");
        sosButton.disabled = false;
        sosButton.innerText = "SOS";
      }
    );
  });
});
</script>
